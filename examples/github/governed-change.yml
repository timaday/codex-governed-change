# AUTHORITY-OWNED REQUIRED-WORKFLOW TEMPLATE. Install this file only in a
# separately protected authority repository and select it through an organization
# or repository ruleset. It MUST NOT be copied into the evaluated repository;
# candidate-local code with the same workflow, job or check name has no authority.
# Activate only after a protected repository-specific adapter and reviewer
# identity are qualified.
# Set GOVERNANCE_REF to a full, previously qualified commit SHA of this project.
# The adopter's target-branch `.governance/ci/` adapter creates candidate-bound
# task, context, RST, qualification, and manifest inputs; it is deliberately not
# supplied by PR code. Missing or invalid adapter output fails closed.
#
# Configure `disposition` as the single required check from its expected GitHub App
# and workflow source, with no bypass where supported. Require an up-to-date pull
# request branch or a merge queue so the checked candidate is the admitted candidate.

name: Governed change

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  GOVERNANCE_REPOSITORY: timaday/codex-governed-change
  POLICY: authority/.governance/effective-policy.json
  PROPOSED_POLICY: authority/.governance/proposed-policy.json
  ARTIFACT_ROOT: candidate/artifacts/governance
  ARTIFACT_REPOSITORY_ROOT: artifacts/governance
  TASK: candidate/artifacts/governance/task-contract.json
  CANDIDATE: candidate/artifacts/governance/candidate.json
  REVIEWER_PROMPT: governance/.codex/review/reviewer.prompt.md

jobs:
  deterministic_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require a full protected governance commit
        env:
          GOVERNANCE_REF: ${{ vars.GOVERNANCE_REF }}
        run: |
          [[ "$GOVERNANCE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "GOVERNANCE_REF must be a protected full commit SHA" >&2
            exit 1
          }

      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Check out target-branch authority and deployment adapter
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: authority

      - name: Check out protected governance implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.GOVERNANCE_REPOSITORY }}
          ref: ${{ vars.GOVERNANCE_REF }}
          fetch-depth: 1
          persist-credentials: false
          path: governance

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Materialize protected candidate-bound inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test -f authority/.governance/ci/prepare-deterministic-inputs.py
          python3 authority/.governance/ci/prepare-deterministic-inputs.py \
            --authority authority \
            --candidate candidate \
            --output "$ARTIFACT_ROOT" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"
          python3 -c 'import json; assert json.load(open("authority/.governance/effective-policy.json"))["evidence_root"] == "artifacts/governance"'
          PYTHONPATH=governance/src python3 -m codex_governance --schema-root governance/schemas scope \
            --repository candidate \
            --task "$TASK" \
            --policy "$POLICY"
          PYTHONPATH=governance/src python3 -m codex_governance --schema-root governance/schemas identify \
            --repository candidate \
            --policy "$POLICY" \
            --mode commit \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output "$ARTIFACT_REPOSITORY_ROOT/candidate.json"

      - name: Run candidate gates through protected policy
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          OBSERVED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          PYTHONPATH=governance/src python3 -m codex_governance --schema-root governance/schemas run-gates \
            --repository candidate \
            --policy "$POLICY" \
            --proposed-policy "$PROPOSED_POLICY" \
            --task "$TASK" \
            --candidate "$CANDIDATE" \
            --reviewer-prompt "$REVIEWER_PROMPT" \
            --run-id "$RUN_ID" \
            --attempt "$RUN_ATTEMPT" \
            --workflow-system github-actions \
            --observed-at "$OBSERVED_AT" \
            --output "$ARTIFACT_REPOSITORY_ROOT/gate-summary.json"
          PYTHONPATH=governance/src python3 -m codex_governance --schema-root governance/schemas mutate \
            --repository candidate \
            --governance-repository governance \
            --mutation-corpus tests/mutation/corpus.json \
            --policy "$POLICY" \
            --task "$TASK" \
            --candidate "$CANDIDATE" \
            --reviewer-prompt "$REVIEWER_PROMPT" \
            --run-id "$RUN_ID" \
            --attempt "$RUN_ATTEMPT" \
            --workflow-system github-actions \
            --observed-at "$OBSERVED_AT" \
            --output "$ARTIFACT_REPOSITORY_ROOT/mutation-summary.json"

      - name: Compile context and reviewer allowlist
        run: |
          OBSERVED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          QUALIFICATION_DECISION_ID="$(python3 -c 'import json,re; value=json.load(open("candidate/artifacts/governance/decision-source-observation.json", encoding="utf-8"))["authenticated_label_decision_id"]; assert re.fullmatch(r"sha256:[0-9a-f]{64}", value); print(value)')"
          PYTHONPATH=governance/src python3 -m codex_governance --schema-root governance/schemas prepare-review \
            --repository candidate \
            --policy "$POLICY" \
            --task "$TASK" \
            --gate-summary "$ARTIFACT_ROOT/gate-summary.json" \
            --mutation-summary "$ARTIFACT_ROOT/mutation-summary.json" \
            --context-qualification authority/.governance/context-qualifications/DEEP.json \
            --qualification-repository authority \
            --qualification-prompt governance/.codex/review/reviewer.prompt.md \
            --candidate "$CANDIDATE" \
            --profile DEEP \
            --token-budget 64000 \
            --model gpt-5.6-sol \
            --reasoning-effort xhigh \
            --verified-decision-id "$QUALIFICATION_DECISION_ID" \
            --observed-at "$OBSERVED_AT" \
            --sources-output "$ARTIFACT_REPOSITORY_ROOT/context-sources.json" \
            --projection-output "$ARTIFACT_REPOSITORY_ROOT/context-projection.json" \
            --receipt-output "$ARTIFACT_REPOSITORY_ROOT/context-receipt.json"
          test -f authority/.governance/ci/prepare-review-inputs.py
          python3 authority/.governance/ci/prepare-review-inputs.py \
            --authority authority \
            --candidate candidate \
            --evidence "$ARTIFACT_ROOT"

      - name: Upload candidate-bound deterministic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governed-deterministic-evidence
          path: candidate/artifacts/governance/
          if-no-files-found: error
          retention-days: 7

  fresh_context_review:
    needs: deterministic_evidence
    if: github.event.repository.private == true
    # This image/runner must provide the qualification-matched Codex executable.
    # No same-session, subagent, or unqualified action fallback is permitted.
    runs-on: [self-hosted, governed-reviewer]
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Require a full protected governance commit
        env:
          GOVERNANCE_REF: ${{ vars.GOVERNANCE_REF }}
        run: |
          [[ "$GOVERNANCE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1

      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Check out protected governance implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.GOVERNANCE_REPOSITORY }}
          ref: ${{ vars.GOVERNANCE_REF }}
          fetch-depth: 1
          persist-credentials: false
          path: governance

      - name: Download deterministic evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: governed-deterministic-evidence
          path: candidate/artifacts/governance

      # The protected self-hosted runner must be pre-authenticated through
      # ChatGPT/Codex. No API key or authentication value enters this job's
      # environment, candidate artifacts or reviewer harness.
      - name: Run qualification-matched fresh read-only review
        run: |
          test "$(codex login status 2>&1)" = "Logged in using ChatGPT"
          test -f candidate/artifacts/governance/reviewer-permitted-inputs.json
          QUALIFICATION_DECISION_ID="$(python3 -c 'import json,re; value=json.load(open("candidate/artifacts/governance/decision-source-observation.json", encoding="utf-8"))["authenticated_label_decision_id"]; assert re.fullmatch(r"sha256:[0-9a-f]{64}", value); print(value)')"
          read -r REVIEW_TIMEOUT_SECONDS REVIEW_MAX_OUTPUT_BYTES < <(
            python3 -c 'import json; policy=json.load(open("candidate/artifacts/governance/effective-policy.json", encoding="utf-8")); print(policy["reviewer"]["timeout_seconds"], policy["reviewer"]["max_output_bytes"])'
          )
          [[ "$REVIEW_TIMEOUT_SECONDS" =~ ^[0-9]+$ ]] || exit 1
          [[ "$REVIEW_MAX_OUTPUT_BYTES" =~ ^[0-9]+$ ]] || exit 1
          PYTHONPATH=governance/src python3 -m codex_governance --schema-root schemas review \
            --authority-root governance \
            --repository candidate \
            --policy artifacts/governance/effective-policy.json \
            --candidate artifacts/governance/candidate.json \
            --permitted-inputs artifacts/governance/reviewer-permitted-inputs.json \
            --prompt .codex/review/reviewer.prompt.md \
            --output-schema schemas/reviewer-result.schema.json \
            --output artifacts/governance/reviewer-result.json \
            --execution-output artifacts/governance/reviewer-execution.json \
            --context-execution-output artifacts/governance/context-execution-receipt.json \
            --stdout-output artifacts/governance/reviewer-stdout.jsonl \
            --stderr-output artifacts/governance/reviewer-stderr.txt \
            --workflow-system github-actions \
            --run-id "${{ github.run_id }}" \
            --attempt "${{ github.run_attempt }}" \
            --model gpt-5.6-sol \
            --reasoning-effort xhigh \
            --verified-decision-id "$QUALIFICATION_DECISION_ID" \
            --timeout-seconds "$REVIEW_TIMEOUT_SECONDS" \
            --max-output-bytes "$REVIEW_MAX_OUTPUT_BYTES"

          shopt -s nullglob
          rapid_inputs=(candidate/artifacts/governance/rapid-review-inputs/*.json)
          ((${#rapid_inputs[@]} > 0)) || {
            echo "required rapid-review permitted inputs are absent" >&2
            exit 1
          }
          for permitted in "${rapid_inputs[@]}"; do
            session_name="$(basename "$permitted" .json)"
            PYTHONPATH=governance/src python3 -m codex_governance --schema-root schemas review \
              --authority-root governance \
              --repository candidate \
              --policy artifacts/governance/effective-policy.json \
              --candidate artifacts/governance/candidate.json \
              --permitted-inputs "${permitted#candidate/}" \
              --prompt .codex/review/reviewer.prompt.md \
              --output-schema schemas/rapid-review-session.schema.json \
              --output "artifacts/governance/rapid-review-sessions/$session_name.json" \
              --execution-output "artifacts/governance/rapid-review-executions/$session_name.json" \
              --context-execution-output "artifacts/governance/rapid-review-context-executions/$session_name.json" \
              --stdout-output "artifacts/governance/rapid-review-executions/$session_name.stdout.jsonl" \
              --stderr-output "artifacts/governance/rapid-review-executions/$session_name.stderr.txt" \
              --workflow-system github-actions \
              --run-id "${{ github.run_id }}" \
              --attempt "${{ github.run_attempt }}" \
              --model gpt-5.6-sol \
              --reasoning-effort xhigh \
              --verified-decision-id "$QUALIFICATION_DECISION_ID" \
              --timeout-seconds "$REVIEW_TIMEOUT_SECONDS" \
              --max-output-bytes "$REVIEW_MAX_OUTPUT_BYTES"
          done

      - name: Upload reviewed candidate-bound evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governed-reviewed-evidence
          path: candidate/artifacts/governance/
          if-no-files-found: error
          retention-days: 7

  disposition:
    if: ${{ always() }}
    needs: [deterministic_evidence, fresh_context_review]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fail closed unless every direct prerequisite succeeded
        env:
          DETERMINISTIC_RESULT: ${{ needs.deterministic_evidence.result }}
          REVIEW_RESULT: ${{ needs.fresh_context_review.result }}
        run: |
          [[ "$DETERMINISTIC_RESULT" == "success" ]] || {
            echo "deterministic_evidence result is not success" >&2
            exit 1
          }
          [[ "$REVIEW_RESULT" == "success" ]] || {
            echo "fresh_context_review result is not success" >&2
            exit 1
          }

      - name: Require a full protected governance commit
        env:
          GOVERNANCE_REF: ${{ vars.GOVERNANCE_REF }}
        run: |
          [[ "$GOVERNANCE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1

      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Check out target-branch authority and deployment adapter
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: authority

      - name: Check out protected aggregator and policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ env.GOVERNANCE_REPOSITORY }}
          ref: ${{ vars.GOVERNANCE_REF }}
          fetch-depth: 1
          persist-credentials: false
          path: governance

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download reviewed candidate-bound evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: governed-reviewed-evidence
          path: candidate/artifacts/governance

      - name: Reconstruct and require READY_FOR_HUMAN
        run: |
          EVALUATED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          PYTHONPATH=governance/src python3 -m codex_governance --schema-root governance/schemas import-reviewer-result \
            --repository candidate \
            --source candidate/artifacts/governance/reviewer-result.json \
            --evidence-root artifacts/governance \
            --destination artifacts/governance/imported/reviewer-result.json \
            --repository-id "$(python3 -c 'import json; print(json.load(open("candidate/artifacts/governance/candidate.json"))["repository_id"])')" \
            --candidate-id "$(python3 -c 'import json; print(json.load(open("candidate/artifacts/governance/candidate.json"))["candidate_id"])')" \
            --task-contract-sha256 "$(sha256sum candidate/artifacts/governance/task-contract.json | awk '{print "sha256:" $1}')" \
            --effective-policy-sha256 "$(sha256sum candidate/artifacts/governance/effective-policy.json | awk '{print "sha256:" $1}')"
          test -f authority/.governance/ci/prepare-manifest-input.py
          python3 authority/.governance/ci/prepare-manifest-input.py \
            --authority authority \
            --candidate candidate \
            --evidence candidate/artifacts/governance \
            --verified-decision-ids-output verified-decision-ids.json
          PYTHONPATH=governance/src python3 -m codex_governance --schema-root governance/schemas assemble-manifest \
            --repository candidate \
            --policy "$POLICY" \
            --input candidate/artifacts/governance/manifest-input.json \
            --output artifacts/governance/evidence-manifest.json
          mapfile -t VERIFIED_DECISIONS < <(python3 -c 'import json,re; values=json.load(open("verified-decision-ids.json")); assert isinstance(values,list) and values and all(re.fullmatch(r"sha256:[0-9a-f]{64}", item) for item in values); print(*values, sep="\n")')
          DECISION_ARGS=()
          for decision_id in "${VERIFIED_DECISIONS[@]}"; do
            DECISION_ARGS+=(--verified-decision-id "$decision_id")
          done
          PYTHONPATH=governance/src python3 -m codex_governance --schema-root schemas evaluate \
            --repository candidate \
            --authority-root governance \
            --prompt .codex/review/reviewer.prompt.md \
            --manifest candidate/artifacts/governance/evidence-manifest.json \
            --candidate candidate/artifacts/governance/candidate.json \
            --evaluated-at "$EVALUATED_AT" \
            "${DECISION_ARGS[@]}" \
            --output artifacts/governance/disposition.json
